name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:trixie

    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build g++ \
            qt6-base-dev curl jq

      - name: Download lingmo-utils
        run: |
          echo "=== Fetching lingmo-utils releases ==="
          RELEASE_JSON=$(curl -s https://api.github.com/repos/Matrinsoft/lingmo-utils/releases/latest)
          echo "$RELEASE_JSON" | jq -r '.assets[].name'
          ASSETS=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("^liblingmoutils(1(?![0-9])|-dev)") and endswith(".deb")) | .browser_download_url')
          for url in $ASSETS; do
            echo "Downloading: $url"
            curl -sL "$url" -o "/tmp/$(basename $url)"
          done
          ls -la /tmp/liblingmoutils*.deb 2>/dev/null || echo "No deb files found"
          dpkg -i /tmp/liblingmoutils*.deb || apt-get install -y -f
          find /usr -name "LingmoUtils*" -type f 2>/dev/null | head -20

      - name: Download lingmo-config
        run: |
          echo "=== Fetching lingmo-config releases ==="
          RELEASE_JSON=$(curl -s https://api.github.com/repos/Matrinsoft/lingmo-config/releases/latest)
          echo "$RELEASE_JSON" | jq -r '.assets[].name'
          ASSETS=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("^liblingmoconfig(1(?![0-9])|-dev)") and endswith(".deb")) | .browser_download_url')
          for url in $ASSETS; do
            echo "Downloading: $url"
            curl -sL "$url" -o "/tmp/$(basename $url)"
          done
          ls -la /tmp/liblingmoconfig*.deb 2>/dev/null || echo "No deb files found"
          dpkg -i /tmp/liblingmoconfig*.deb || apt-get install -y -f
          find /usr -name "LingmoConfig*" -type f 2>/dev/null | head -20

      - name: Download lingmo-ipc
        run: |
          echo "=== Fetching lingmo-ipc releases ==="
          RELEASE_JSON=$(curl -s https://api.github.com/repos/Matrinsoft/lingmo-ipc/releases/latest)
          echo "$RELEASE_JSON" | jq -r '.assets[].name'
          ASSETS=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("^liblingmoipc(1(?![0-9])|-dev)") and endswith(".deb")) | .browser_download_url')
          for url in $ASSETS; do
            echo "Downloading: $url"
            curl -sL "$url" -o "/tmp/$(basename $url)"
          done
          ls -la /tmp/liblingmoipc*.deb 2>/dev/null || echo "No deb files found"
          dpkg -i /tmp/liblingmoipc*.deb || apt-get install -y -f
          find /usr -name "LingmoIPC*" -type f 2>/dev/null | head -20

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH=/usr
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix install_dir

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lingmo-session
          path: install_dir/
