name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:trixie

    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build g++ \
            qt6-base-dev curl jq

      - name: Download lingmo-utils
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/Matrinsoft/lingmo-utils/releases/latest)
          echo "Assets: $(echo "$RELEASE_JSON" | jq -r '.assets[].name')"
          echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url' | grep '\.deb$' | while read url; do
            echo "Downloading: $url"
            curl -sL "$url" -o "/tmp/$(basename $url)"
          done
          ls -la /tmp/*.deb 2>/dev/null
          dpkg -i /tmp/*.deb || apt-get install -y -f

      - name: Download lingmo-config
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/Matrinsoft/lingmo-config/releases/latest)
          echo "Assets: $(echo "$RELEASE_JSON" | jq -r '.assets[].name')"
          echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url' | grep '\.deb$' | while read url; do
            echo "Downloading: $url"
            curl -sL "$url" -o "/tmp/$(basename $url)"
          done
          dpkg -i /tmp/*.deb || apt-get install -y -f

      - name: Download lingmo-ipc
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/Matrinsoft/lingmo-ipc/releases/latest)
          echo "Assets: $(echo "$RELEASE_JSON" | jq -r '.assets[].name')"
          echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url' | grep '\.deb$' | while read url; do
            echo "Downloading: $url"
            curl -sL "$url" -o "/tmp/$(basename $url)"
          done
          dpkg -i /tmp/*.deb || apt-get install -y -f

      - name: Verify installation
        run: |
          echo "=== Installed packages ==="
          dpkg -l | grep lingmo || echo "No lingmo packages found"
          echo "=== Library files ==="
          find /usr -name "libLingmo*" 2>/dev/null || echo "No libraries found"
          echo "=== CMake configs ==="
          find /usr -path "*/cmake/Lingmo*" -type f 2>/dev/null || echo "No cmake configs found"

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH=/usr
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix install_dir

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lingmo-session
          path: install_dir/
